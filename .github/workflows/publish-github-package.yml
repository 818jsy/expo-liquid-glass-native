name: Publish GitHub Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-github-package
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install package dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Read package metadata
        id: package_meta
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          GITHUB_PACKAGE_NAME="@818jsy/${PACKAGE_NAME}"
          echo "name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "npm_url=https://www.npmjs.com/package/${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "github_package_name=${GITHUB_PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "github_package_url=https://github.com/818jsy/expo-liquid-glass-native/pkgs/npm/${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish package to GitHub Packages
        id: publish_github_packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package_meta.outputs.version }}
          GITHUB_PACKAGE_NAME: ${{ steps.package_meta.outputs.github_package_name }}
        run: |
          TMP_DIR="$(mktemp -d)"
          cp -R . "${TMP_DIR}/"
          rm -rf "${TMP_DIR}/node_modules" "${TMP_DIR}/example/node_modules"
          cd "${TMP_DIR}"

          npm pkg set name="${GITHUB_PACKAGE_NAME}"
          npm pkg set publishConfig.registry="https://npm.pkg.github.com"

          printf '%s\n' \
            "@818jsy:registry=https://npm.pkg.github.com" \
            "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" \
            > .npmrc

          npm ci

          if npm view "${GITHUB_PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Version ${PACKAGE_VERSION} is already published to GitHub Packages. Skipping publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm publish --registry https://npm.pkg.github.com
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_TAG: ${{ steps.package_meta.outputs.tag }}
          PACKAGE_NPM_URL: ${{ steps.package_meta.outputs.npm_url }}
          PACKAGE_GITHUB_NAME: ${{ steps.package_meta.outputs.github_package_name }}
          PACKAGE_GITHUB_URL: ${{ steps.package_meta.outputs.github_package_url }}
          GITHUB_PACKAGE_PUBLISHED_IN_THIS_RUN: ${{ steps.publish_github_packages.outputs.published }}
        run: |
          if gh release view "$PACKAGE_TAG" >/dev/null 2>&1; then
            echo "Release ${PACKAGE_TAG} already exists. Skipping release creation."
            exit 0
          fi

          if [ "$GITHUB_PACKAGE_PUBLISHED_IN_THIS_RUN" = "true" ]; then
            GH_PACKAGE_RELEASE_STATUS="Published to GitHub Packages in this workflow run."
          else
            GH_PACKAGE_RELEASE_STATUS="Version already existed on GitHub Packages."
          fi

          RELEASE_NOTES="$(printf '%s\n' \
            "npm: ${PACKAGE_NPM_URL}" \
            "github package: ${PACKAGE_GITHUB_NAME}" \
            "github package page: ${PACKAGE_GITHUB_URL}" \
            "" \
            "${GH_PACKAGE_RELEASE_STATUS}")"

          gh release create "$PACKAGE_TAG" \
            --target main \
            --title "${PACKAGE_TAG}" \
            --notes "$RELEASE_NOTES"
